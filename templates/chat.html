<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0a1e">
<title>AmigosChat Global. V 1.1</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="chat-body">
<header class="chat-header">
  <div class="header-left">
    <div class="logo-mini">K</div>
    <div>
      <div class="header-title">AmigosChat Global</div>
      <div class="online-badge">
        <span class="dot-live"></span>
        <span id="online-count">0</span> online
      </div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleProfile()" title="Meu perfil">puta</button>
    <button class="icon-btn" onclick="toggleAdmin()" id="adminBtn" style="display:none" title="Painel Admin">⚙️</button>
    <button class="icon-btn" onclick="doLogout()" title="Sair">Sair</button>
  </div>
</header>
<main class="chat-main" id="chatMain">
  <div id="messages" class="messages"></div>
</main>

<div class="typing-indicator" id="typing-indicator" style="display:none">digitando...</div>
<footer class="chat-footer">
  <label class="attach-btn" for="img-input">Foto</label>
  <input type="file" id="img-input" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp" hidden>

  <div class="preview-box" id="preview-box" style="display:none">
    <img id="preview-img" alt="preview">
    <button onclick="clearPreview()" type="button">✕</button>
  </div>

  <input type="text" id="msg-input" placeholder="Digite uma mensagem..." autocomplete="off">
  <button class="send-btn" onclick="sendMessage()" type="button">➤</button>
</footer>
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h3>Meu Perfil</h3>

    <div class="avatar-edit">
      <img id="avatar-preview" src="" alt="avatar">
      <label for="avatar-input" class="avatar-label">Trocar foto</label>
      <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp" hidden>
    </div>

    <input type="text" id="prof-bio" placeholder="Sua bio..." maxlength="150">
    <input type="text" id="prof-webhook" placeholder="Webhook Discord (opcional)">
    <input type="text" id="prof-code" placeholder="Código admin (opcional)">

    <button class="btn-primary" onclick="saveProfile()" type="button">Salvar</button>
    <button class="btn-secondary" onclick="toggleProfile()" type="button">Fechar</button>
  </div>
</div>
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3>Painel Admin</h3>

    <input type="text" id="admin-target" placeholder="Usuário alvo">
    <button class="btn-danger" onclick="banUser()" type="button">Banir (deletar)</button>
    <button class="btn-primary" onclick="promoteUser()" type="button">Promover a Admin</button>

    <div id="user-list" class="user-list"></div>

    <button class="btn-secondary" onclick="toggleAdmin()" type="button">Fechar</button>
  </div>
</div>

<div class="credits-footer">
   <b>Gabriel </b> & <b>Erik</b>
</div>

<script src="/static/js/chat.js"></script>
<script src="/static/js/profile.js"></script>
</body>
</html>
